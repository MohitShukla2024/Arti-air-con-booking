<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arti Air Con - Chatbot Demo</title>
    <!-- Widget CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Include Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Demo Page Styling - Not part of the widget itself */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1527689638836-411945a2b57c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .demo-content {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        .demo-content h1 { color: #0056b3; }
        .demo-content p { color: #333; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="demo-content">
        <h1>Arti Air Con</h1>
        <p>This is a demo page to showcase the AI Chatbot Widget.<br>Look at the bottom right corner of the screen to interact with the Arti Air Assistant.</p>
    </div>

    <!-- START OF ARTI AIR CHAT WIDGET -->
    <div id="arti-chat-widget-container">
        
        <!-- Chat Bubble (Launcher) -->
        <button id="arti-chat-launcher" aria-label="Open Chat">
            <i class="fas fa-comment-dots"></i>
        </button>

        <!-- Chat Window -->
        <div id="arti-chat-window" class="hidden">
            <div class="arti-chat-header">
                <div class="arti-chat-title">
                    <div class="arti-status-indicator"></div>
                    <div>
                        <strong>Arti Air Assistant</strong>
                        <span class="arti-subtitle">Usually replies instantly</span>
                    </div>
                </div>
                <button id="arti-chat-close" aria-label="Close Chat">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="arti-chat-body" id="arti-chat-body">
                <!-- Welcome Message -->
                <div class="arti-message arti-bot-message">
                    <div class="arti-message-content">
                        Hi there! 👋 Welcome to Arti Air Con. How can I help you today?
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="arti-quick-actions" id="arti-quick-actions">
                    <button class="arti-quick-action-btn">Book AC Service</button>
                    <button class="arti-quick-action-btn">Pricing Plans</button>
                    <button class="arti-quick-action-btn">Emergency Repair</button>
                    <button class="arti-quick-action-btn">Check Areas</button>
                </div>
            </div>

            <div class="arti-chat-footer">
                <form id="arti-chat-form">
                    <input type="text" id="arti-chat-input" placeholder="Type a message..." autocomplete="off" required>
                    <button type="submit" id="arti-chat-send" aria-label="Send Message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <!-- END OF ARTI AIR CHAT WIDGET -->

    <!-- Widget Scripts -->
    <script src="script.js"></script>
</body>
</html>
